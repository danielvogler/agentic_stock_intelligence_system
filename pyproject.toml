[project]
name = "stock-intelligence-agent"
version = "0.1.0"
description = "An advanced, multi-agent intelligence platform powered by the Google Agent Development Kit (ADK) to autonomously correlate corporate history milestones with historical stock market performance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=3.9.7",
    "google-adk>=1.23.0",
    "google-cloud-aiplatform>=1.75.0",
    "google-cloud-logging>=3.13.0",
    "google-genai>=0.3.0",
    "langchain-community==0.3.20",
    "opentelemetry-api>=1.37.0",
    "opentelemetry-exporter-gcp-trace>=1.11.0",
    "opentelemetry-sdk>=1.37.0",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "wikipedia==1.4.0",
    "yfinance>=1.1.0",
    "pexpect>=4.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "D"]
ignore = ["E501", "D100", "D104", "D203", "D212", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
